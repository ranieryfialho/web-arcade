name: Supabase Keep Alive

on:
  schedule:
    # Roda toda segunda e quinta-feira às 00:00
    - cron: '0 0 * * 1,4' 
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping and Log Supabase Activity
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/health_check" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{ "status": "automated-ping" }'